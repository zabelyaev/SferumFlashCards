services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    init: true
    user: "${APP_UID:-999}:${APP_GID:-999}"
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__DB__NAME: ${POSTGRES_DB:-fastapi_starter}
      APP_CONFIG__DB__USER: ${DB_APP_USER:-fastapi_starter_app}
      APP_CONFIG__DB__PASSWORD: ${DB_APP_PASSWORD:-app}
      APP_CONFIG__DB__SQLA__POOL_SIZE: ${DB_POOL_SIZE:-5}
      APP_CONFIG__DB__SQLA__MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      APP_CONFIG__RUN__WORKERS: ${APP_WORKERS:-4}
      APP_CONFIG__RUN__BACKLOG: ${APP_BACKLOG:-4096}
      APP_CONFIG__RUN__TIMEOUT_KEEP_ALIVE: ${APP_KEEP_ALIVE_SECONDS:-30}
      APP_CONFIG__RUN__TIMEOUT_GRACEFUL_SHUTDOWN: 30
      APP_CONFIG__AUTH__APP_KEY: ${APP_CONFIG__AUTH__APP_KEY:-}
      APP_CONFIG__CORS__ORIGINS: '${APP_CONFIG__CORS__ORIGINS:-["*"]}'
      APP_CONFIG__DOCUMENTATION__PREFIX: ${APP_CONFIG__DOCUMENTATION__PREFIX:-/internal}
      APP_CONFIG__DOCUMENTATION__PASSWORD: ${APP_CONFIG__DOCUMENTATION__PASSWORD:-}
      APP_CONFIG__DOCUMENTATION__LOGIN: ${APP_CONFIG__DOCUMENTATION__LOGIN:-}
      APP_CONFIG__DOCUMENTATION__ENABLED: ${APP_CONFIG__DOCUMENTATION__ENABLED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      APP_CONFIG__AUTH: '{}'
      APP_CONFIG__CORS: '{}'
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__DB__NAME: ${POSTGRES_DB:-fastapi_starter}
      APP_CONFIG__DB__USER: ${DB_MIGRATION_USER:-fastapi_starter_owner}
      APP_CONFIG__DB__PASSWORD: ${DB_MIGRATION_PASSWORD:-app_owner}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "src/alembic.ini", "upgrade", "head"]
    restart: "no"

  fsrs-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
      target: optimizer
    init: true
    user: "${APP_UID:-999}:${APP_GID:-999}"
    environment:
      APP_CONFIG__AUTH: '{}'
      APP_CONFIG__CORS: '{}'
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__DB__NAME: ${POSTGRES_DB:-fastapi_starter}
      APP_CONFIG__DB__USER: ${DB_APP_USER:-fastapi_starter_app}
      APP_CONFIG__DB__PASSWORD: ${DB_APP_PASSWORD:-app}
      FSRS_OPTIMIZER_HOUR_UTC: ${FSRS_OPTIMIZER_HOUR_UTC:-21}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: ${FSRS_OPTIMIZER_CPUS:-1.0}
    mem_limit: ${FSRS_OPTIMIZER_MEM_LIMIT:-2g}
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_starter}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-fastapi_starter_owner}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-app_owner}
      DB_APP_USER: ${DB_APP_USER:-fastapi_starter_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-fastapi_starter}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    restart: unless-stopped

volumes:
  postgres_data:

[project]
name = "fastapi-starter"
version = "0.1.0"
description = "Async FastAPI service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.46.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "tzdata>=2026.1",
    "fsrs==6.3.2",
]

[project.optional-dependencies]
fsrs-optimizer = ["fsrs[optimizer]==6.3.2", "torch>=2.11"]

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "ruff>=0.15.12",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires a migrated PostgreSQL test database",
]
